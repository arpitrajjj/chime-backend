# Chime — nginx reverse proxy (REST + WebSocket)
# /etc/nginx/sites-available/chime
# After enabling: sudo certbot --nginx -d chat.example.com  (adds TLS automatically)

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;      # ← change me

    # ~1 MB bodies are far above Chime's 32 KB cap; keeps nginx lenient
    client_max_body_size 1m;

    # --- WebSocket -------------------------------------------------
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;     # keep long-lived sockets alive
        proxy_send_timeout 3600s;
    }

    # --- REST ------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
    }

    location / {
        return 404 '{"error":"not found"}';
        add_header Content-Type application/json always;
    }
}
